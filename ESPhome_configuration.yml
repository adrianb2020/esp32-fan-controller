sensor:
  - platform: pulse_counter
    pin:
      number: 14 # Replace with your actual GPIO pin
      mode:
        input: true # Configures the pin as an input to read signals
        pullup: false  # Since you have an external pull-up
    name: 'CPU'
    id: cpufan_pulse
    unit_of_measurement: 'RPM'
    accuracy_decimals: 0  # Removes decimals
    filters:
      multiply: 0.5  # Multiply by 0.5 to convert Hz to RPM (since 2 pulses per revolution)
    count_mode:
      rising_edge: INCREMENT
      falling_edge: DISABLE
    update_interval: 3s
    
  - platform: pulse_counter
