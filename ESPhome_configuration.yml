    update_interval: 15s

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  id: bus_a

switch:
  - platform: gpio
    pin:
      number: 16
      allow_other_uses: true
    id: shortXeonW
    name: "Short Press"
    icon: "mdi:power"
    on_turn_on:
    - delay: 150ms
    - switch.turn_off: shortXeonW
  - platform: gpio
    pin:
      number: 16
      allow_other_uses: true
    id: longXeonW
    name: "Long Press"
    icon: "mdi:power"
    on_turn_on:
    - delay: 4000ms
    - switch.turn_off: longXeonW

binary_sensor:
  - platform: gpio
    pin:
      number: 23
      inverted: true # Inverted if optocoupler pulls low when active
      mode:
        input: true # Configures the pin as an input to read signals
        pullup: false  # Since you have an external pull-up / ESP32 PINs 34-36 does not support internal pull-up
    name: "Power State"
    icon: "mdi:lightbulb-question"